<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf7f1" />
  <title>Quiz Théâtre</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="public-shell">

    <div id="join-view" class="stack">
      <h1 class="center">Rejoindre le quiz</h1>
      <div class="scallop pink"></div>
      <div class="card stack">
        <label for="code-input">Code de session</label>
        <input id="code-input" type="text" placeholder="XXXX" maxlength="4" autocapitalize="characters" />
        <label for="name-input">Prénom</label>
        <input id="name-input" type="text" placeholder="Prénom" maxlength="30" />
        <button id="join-btn">Rejoindre</button>
        <p id="join-error" class="muted hidden"></p>
      </div>
    </div>

    <div id="session-view" class="stack hidden" style="flex:1">
      <div class="spread">
        <span class="badge" id="name-badge"></span>
        <span class="badge" id="code-badge"></span>
      </div>
      <div id="content" style="flex:1; display:flex; flex-direction:column;"></div>
      <div id="ticket-badge" class="ticket-badge hidden">
        <span class="ticket-label">Ticket</span>
        <span class="ticket-number" id="ticket-number">N° 000</span>
      </div>
    </div>

  </div>

  <div id="winner-overlay" class="winner-overlay hidden">
    <div id="confetti-container" class="confetti-container"></div>
    <div class="winner-message">🎉 T'as gagné ! 🎉</div>
  </div>

  <script type="module" src="assets/js/public.js"></script>
</body>
</html>
